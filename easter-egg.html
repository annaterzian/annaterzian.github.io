<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta http-equiv="X-UA-Compatible" content="ie=edge" />
		<title>🐷 Twitch Stream Easter Egg 🐷</title>
		<link rel="stylesheet" href="styles.css" />
		<style>
			body {
				background-color: #111;
				color: #00ffcc;
				text-align: center;
				font-family: "VT323", monospace;
			}
			.glitch {
				font-size: 3rem;
				text-shadow: 1px 1px #ff0000, -1px -1px #00ffcc;
				animation: glitch 1s infinite;
			}
			@keyframes glitch {
				0% {
					text-shadow: 2px 2px #ff0000, -2px -2px #00ffcc;
				}
				50% {
					text-shadow: -2px -2px #ff0000, 2px 2px #00ffcc;
				}
				100% {
					text-shadow: 1px 1px #ff0000, -1px -1px #00ffcc;
				}
			}
		</style>
	</head>
	<body>
		<h1 class="glitch-text">You found the Easter Egg! 🐷</h1>
		<p>Welcome to my Twitch stream page!</p>

		<!-- Twitch Embed -->
		<div style="text-align: center">
			<iframe
				src="https://player.twitch.tv/?channel=yourtwitchusername&parent=yourdomain.com"
				height="480"
				width="854"
				frameborder="0"
				scrolling="no"
				allowfullscreen="true">
			</iframe>
			<p>
				<a href="https://www.twitch.tv/ThatOneHalfAsian" target="_blank"
					>Watch directly on Twitch!</a
				>
			</p>
		</div>
	</body>
</html>
